<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Menti Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app auth-app">
        <div class="board">
            <header class="board-header">
                <h1>Create Account</h1>
                <p class="board-sub">Join the learning community</p>
            </header>

            <div class="thread auth-thread">
                {% with messages = get_flashed_messages(with_categories=true) %}
                  {% if messages %}
                    {% for category, message in messages %}
                      <div class="msg msg-{{ 'model' if category == 'message' else 'user' }}">
                        <div class="msg-body">
                          <div class="msg-text">{{ message }}</div>
                        </div>
                      </div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}

                <form method="POST" action="{{ url_for('register') }}" class="auth-form">
                    <div class="auth-fields">
                        <input type="text" id="username" name="username" placeholder="Choose a username" minlength="3" maxlength="32" pattern="[A-Za-z0-9_]+" autocomplete="username" required>
                        <input type="password" id="password" name="password" placeholder="Create a password" minlength="8" autocomplete="new-password" required>
                        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm password" minlength="8" autocomplete="new-password" required>
                        <button type="submit">
                            Create Account
                        </button>
                        <p class="auth-switch">
                            Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <script src="{{ url_for('static', filename='chat.js') }}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            renderMathInElement(document.body);
        });
    </script>
</body>
</html>
